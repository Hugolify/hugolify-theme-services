module:
  mounts:
    - source: archetypes
      target: archetypes
    - source: assets
      target: assets
    - source: content
      target: content
    - source: i18n
      target: i18n
    - source: layouts
      target: layouts

params:

  # Hugolify admin
  admin:
    collections:
      services:
        enable: true
        filter:
          - field: isIndex
            value: false
        icon:
          bootstrap_icons: suitcase-lg
          iconoir: suitcase
          lucide: handshake
          material_icons: business_center
          material_symbols: business_center
        sortable_fields: [weight, title]

  # Image
  services:
    thumbnail:
      desktop: '416x179'
      mobile: '300x129'
      scrollsnap: '240x103'
      sizes: 100vw, 50vw, 33vw

# Default
permalinks:
  page:
    services: /services/:slug/
